            schema:
              $ref: '#/components/schemas/GitHubIntegrationRequest'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubIntegration'
          description: ''
  /management/integrations/:
    get:
