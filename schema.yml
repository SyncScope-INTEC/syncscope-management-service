openapi: 3.0.3
info:
  title: SyncScope Management Service API
  version: 1.0.0
  description: Team and project management service for SyncScope platform
paths:
  /:
    get:
      operationId: root_retrieve
      description: API Home page showing main navigation routes and service links.
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /health/:
    get:
      operationId: health_retrieve
      description: Check if the service is alive (basic endpoint for load balancers).
      summary: Liveness check endpoint
      tags:
      - Health
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
          description: ''
  /health/detailed/:
    get:
      operationId: health_detailed_retrieve
      description: Check the health status of the service including database and cache
        connections.
      summary: Health check endpoint
      tags:
      - Health
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    example: '2024-01-01T12:00:00Z'
                  version:
                    type: string
                    example: 1.0.0
                  services:
                    type: object
                    properties:
                      database:
                        type: string
                        example: healthy
                      cache:
                        type: string
                        example: healthy
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unhealthy
                  errors:
                    type: array
                    items:
                      type: string
          description: ''
  /health/live/:
    get:
      operationId: health_live_retrieve
      description: Check if the service is alive (basic endpoint for load balancers).
      summary: Liveness check endpoint
      tags:
      - Health
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
          description: ''
  /health/ready/:
    get:
      operationId: health_ready_retrieve
      description: Check if the service is ready to accept requests.
      summary: Readiness check endpoint
      tags:
      - Health
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not ready
          description: ''
  /management/:
    get:
      operationId: root_retrieve_2
      description: API Home page showing main navigation routes and service links.
      security:
      - Bearer: []
      - {}
      responses:
        '200':
          description: No response body
  /management/commits/:
    get:
      operationId: commits_list
      description: Get a list of code commits the user has access to.
      summary: List code commits
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Projects
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCodeCommitList'
          description: ''
  /management/commits/{id}/:
    get:
      operationId: commits_retrieve
      description: Get detailed information about a specific commit.
      summary: Get commit details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this code commit.
        required: true
      tags:
      - Projects
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeCommit'
          description: ''
  /management/github-integrations/:
    get:
      operationId: github_integrations_list
      description: Get a list of all GitHub integrations the user has access to.
      summary: List GitHub integrations
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Integrations
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGitHubIntegrationList'
          description: ''
    post:
      operationId: github_integrations_create
      description: Create a new GitHub integration for a project.
      summary: Create GitHub integration
      tags:
      - Integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubIntegrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GitHubIntegrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GitHubIntegrationRequest'
        required: true
      security:
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubIntegration'
          description: ''
  /management/github-integrations/{id}/:
    get:
      operationId: github_integrations_retrieve
      description: Get detailed information about a specific GitHub integration.
      summary: Get GitHub integration details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this git hub integration.
        required: true
      tags:
      - Integrations
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubIntegration'
          description: ''
    put:
      operationId: github_integrations_update
      description: Update GitHub integration configuration.
      summary: Update GitHub integration
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this git hub integration.
        required: true
      tags:
      - Integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubIntegrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GitHubIntegrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GitHubIntegrationRequest'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubIntegration'
          description: ''
    patch:
      operationId: github_integrations_partial_update
      description: Partially update GitHub integration configuration.
      summary: Partially update GitHub integration
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this git hub integration.
        required: true
      tags:
      - Integrations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGitHubIntegrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGitHubIntegrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGitHubIntegrationRequest'
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubIntegration'
          description: ''
    delete:
      operationId: github_integrations_destroy
      description: Delete a GitHub integration.
      summary: Delete GitHub integration
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this git hub integration.
        required: true
      tags:
      - Integrations
      security:
      - Bearer: []
      responses:
        '204':
          description: No response body
  /management/github-integrations/{id}/sync/:
    post:
      operationId: github_integrations_sync_create
      description: Trigger a manual sync for a GitHub integration.
      summary: Sync GitHub integration
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this git hub integration.
        required: true
      tags:
