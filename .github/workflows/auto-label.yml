name: Auto Label PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  auto-label:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Auto-assign labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const title = context.payload.pull_request.title.toLowerCase();
            const baseBranch = context.payload.pull_request.base.ref;
            const headBranch = context.payload.pull_request.head.ref.toLowerCase();
            const isDraft = context.payload.pull_request.draft;
            
            // Get the files changed in this PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            let labels = [];
            
            // Size-based labels
            const totalChanges = files.reduce((acc, file) => acc + file.additions + file.deletions, 0);
            if (totalChanges > 1000) {
              labels.push('size/XL');
            } else if (totalChanges > 500) {
              labels.push('size/L');
            } else if (totalChanges > 100) {
              labels.push('size/M');
            } else if (totalChanges > 20) {
              labels.push('size/S');
            } else {
              labels.push('size/XS');
            }
            
            // Type-based labels from title/branch
            const typeKeywords = {
              'bug': ['fix', 'bug', 'hotfix', 'patch'],
              'feature': ['feat', 'feature', 'add', 'implement'],
              'docs': ['docs', 'documentation', 'readme'],
              'refactor': ['refactor', 'cleanup', 'improve'],
              'test': ['test', 'testing', 'spec'],
              'ci/cd': ['ci', 'cd', 'deploy', 'workflow', 'action'],
              'security': ['security', 'auth', 'permission', 'vulnerability'],
              'performance': ['perf', 'performance', 'optimize', 'speed'],
              'breaking': ['breaking', 'major', 'break']
            };
            
            for (const [label, keywords] of Object.entries(typeKeywords)) {
              if (keywords.some(keyword => title.includes(keyword) || headBranch.includes(keyword))) {
                labels.push(`type/${label}`);
              }
            }
            
            // Area-based labels from files changed - Management service specific
            const areaKeywords = {
              'backend': ['/apps/', '/config/', 'models.py', 'views.py', 'serializers.py'],
              'database': ['migrations/', 'models.py', '.sql'],
              'api': ['views.py', 'serializers.py', 'urls.py', '/api/'],
              'auth': ['authentication.py', 'permissions.py', 'auth', 'login', 'permission'],
              'management': ['management/', 'team', 'project', 'integration'],
              'github-integration': ['github', 'oauth', 'webhook'],
              'tests': ['test_', '/tests/', '.test.'],
              'config': ['settings.py', '.env', 'config/', 'requirements.txt'],
              'admin': ['admin.py'],
              'docker': ['Dockerfile', 'docker-compose', '.dockerignore'],
              'workflows': ['.github/', 'workflow']
            };
            
            for (const [area, patterns] of Object.entries(areaKeywords)) {
              if (files.some(file => patterns.some(pattern => file.filename.includes(pattern)))) {
                labels.push(`area/${area}`);
              }
            }
            
            // Priority-based labels from title
            if (title.includes('urgent') || title.includes('critical') || title.includes('hotfix')) {
              labels.push('priority/high');
            } else if (title.includes('minor') || title.includes('cleanup')) {
              labels.push('priority/low');
            } else {
              labels.push('priority/medium');
            }
            
            // Target branch labels
            if (baseBranch === 'prod' || baseBranch === 'production') {
              labels.push('target/production');
            } else if (baseBranch === 'main' || baseBranch === 'master') {
              labels.push('target/main');
            } else if (baseBranch === 'dev' || baseBranch === 'develop') {
              labels.push('target/development');
            }
            
            // Draft label
            if (isDraft) {
              labels.push('draft');
            }
            
            // Dependencies label
            if (files.some(file => ['requirements.txt', 'requirements-test.txt', 'pyproject.toml', 'package.json'].includes(file.filename))) {
              labels.push('dependencies');
            }
            
            // Database migration label
            if (files.some(file => file.filename.includes('migrations/'))) {
              labels.push('database-migration');
            }
            
            // Remove duplicates and apply labels
            const uniqueLabels = [...new Set(labels)];
            
            if (uniqueLabels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: uniqueLabels
              });
              
              console.log(`Applied labels: ${uniqueLabels.join(', ')}`);
            }
            
            // Add comment with PR analysis
            const analysisComment = `🤖 **Management Service - PR Analysis**

            **📊 Size**: ${totalChanges} lines changed (${files.length} files)
            **🏷️ Auto-assigned labels**: ${uniqueLabels.join(', ') || 'None'}
            **🎯 Target**: \`${baseBranch}\` branch
            **📝 Status**: ${isDraft ? 'Draft' : 'Ready for review'}

            **📁 Files by category**:
            ${Object.entries(areaKeywords)
              .map(([area, patterns]) => {
                const matchingFiles = files.filter(file => 
                  patterns.some(pattern => file.filename.includes(pattern))
                ).map(f => f.filename);
                return matchingFiles.length > 0 ? `- **${area}**: ${matchingFiles.slice(0, 3).join(', ')}${matchingFiles.length > 3 ? ` (+${matchingFiles.length - 3} more)` : ''}` : null;
              })
              .filter(Boolean)
              .join('\n') || '- No specific categories detected'}

            ---
            *This analysis was automatically generated for the Management Service. Labels and analysis may be adjusted during review.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: analysisComment
            });